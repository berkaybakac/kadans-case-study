<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>Architecture of Kadans and Tellal</title><defs><marker id="h-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#768390"/></marker><marker id="h-server" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f94fb"/></marker><marker id="h-pi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e17ff0"/></marker><marker id="h-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0a742"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f0805a"/></marker></defs><rect width="1200" height="770" rx="16" fill="#0d1117" stroke="#3d444d"/><text x="40" y="54" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="start">Where everything runs</text><text x="40" y="82" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">Everything a store needs lives on the customer's network. The cloud generates speech, watches the fleet and serves releases.</text><rect x="24" y="104" width="770" height="600" rx="16" fill="#151b23" stroke="#3d444d" stroke-width="1.2" stroke-dasharray="6 5"/><rect x="818" y="104" width="358" height="600" rx="16" fill="#151b23" stroke="#3d444d" stroke-width="1.2" stroke-dasharray="6 5"/><text x="44" y="132" font-size="12.5" font-weight="700" fill="#9198a1" text-anchor="start" letter-spacing="1">CUSTOMER NETWORK · VPN</text><text x="838" y="132" font-size="12.5" font-weight="700" fill="#9198a1" text-anchor="start" letter-spacing="1">CLOUD</text><rect x="48" y="156" width="240" height="88" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="48" y="168" width="4" height="64" rx="2" fill="#9198a1"/><text x="68" y="190" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Customer ERP</text><text x="68" y="218" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">SQL Server, read-only</text><rect x="48" y="296" width="240" height="88" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="48" y="308" width="4" height="64" rx="2" fill="#9198a1"/><text x="68" y="330" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Headquarters panel</text><text x="68" y="358" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">React · TypeScript</text><rect x="360" y="156" width="410" height="268" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="360" y="168" width="4" height="244" rx="2" fill="#8f94fb"/><text x="380" y="190" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Kadans server</text><text x="380" y="218" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">one Windows service on the customer's machine</text><rect x="382" y="238" width="366" height="36" rx="8" fill="#1b1d3d" stroke="#1b1d3d" stroke-width="1.2"/><text x="398" y="261" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">FastAPI · PostgreSQL · audio store</text><rect x="382" y="282" width="366" height="36" rx="8" fill="#1b1d3d" stroke="#1b1d3d" stroke-width="1.2"/><text x="398" y="305" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Go: ERP collector · prayer-time sync</text><rect x="382" y="326" width="366" height="36" rx="8" fill="#1b1d3d" stroke="#1b1d3d" stroke-width="1.2"/><text x="398" y="349" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Go: MQTT 5 broker · fleet uplink</text><rect x="382" y="370" width="366" height="36" rx="8" fill="#1b1d3d" stroke="#1b1d3d" stroke-width="1.2"/><text x="398" y="393" font-size="14" font-weight="400" fill="#e6edf3" text-anchor="start">Caddy TLS · nightly backup · self-update</text><path d="M288 200 H354" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><text x="321" y="190" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">SQL</text><path d="M294 340 H354" fill="none" stroke="#768390" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)" marker-start="url(#h-arrow)"/><text x="324" y="330" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">HTTPS</text><rect x="360" y="548" width="410" height="136" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="360" y="560" width="4" height="112" rx="2" fill="#e17ff0"/><text x="380" y="576" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Branch players · Raspberry Pi</text><rect x="380" y="592" width="118" height="80" rx="8" fill="#2c1530" stroke="#2c1530" stroke-width="1.2"/><text x="392" y="614" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="start">Branch</text><text x="392" y="636" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">mpv · cache</text><text x="392" y="654" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">pure decide()</text><rect x="508" y="592" width="118" height="80" rx="8" fill="#2c1530" stroke="#2c1530" stroke-width="1.2"/><text x="520" y="614" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="start">Branch</text><text x="520" y="636" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">mpv · cache</text><text x="520" y="654" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">pure decide()</text><rect x="636" y="592" width="118" height="80" rx="8" fill="#1c2129" stroke="#3d444d" stroke-width="1.2" stroke-dasharray="5 4"/><text x="648" y="614" font-size="14" font-weight="650" fill="#9198a1" text-anchor="start">Next branch</text><text x="648" y="636" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">passive, ready</text><text x="648" y="654" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">for its first Pi</text><path d="M392 430 V542" fill="none" stroke="#8f94fb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-server)"/><text x="401" y="480" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">plans + audio</text><text x="401" y="497" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">HTTPS pull</text><path d="M500 430 V542" fill="none" stroke="#e17ff0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-pi)"/><text x="509" y="480" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">revision hint</text><text x="509" y="497" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">MQTT</text><path d="M604 542 V430" fill="none" stroke="#e17ff0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#h-pi)"/><text x="613" y="480" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">presence,</text><text x="613" y="497" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">live state</text><path d="M700 542 V430" fill="none" stroke="#8f94fb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-server)"/><text x="709" y="480" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">evidence</text><text x="709" y="497" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="start">HTTPS</text><rect x="840" y="156" width="312" height="120" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="840" y="168" width="4" height="96" rx="2" fill="#f0a742"/><text x="860" y="190" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Tellal · AI platform</text><text x="860" y="218" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Claude copy behind guardrails</text><text x="860" y="238" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">ElevenLabs speech</text><text x="860" y="258" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">prepaid balances · spend caps</text><rect x="840" y="306" width="312" height="92" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="840" y="318" width="4" height="68" rx="2" fill="#9198a1"/><text x="860" y="340" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Fleet hub</text><text x="860" y="368" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">health reports · Prometheus · Grafana</text><rect x="840" y="428" width="312" height="92" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="840" y="440" width="4" height="68" rx="2" fill="#9198a1"/><text x="860" y="462" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Signed releases</text><text x="860" y="490" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">Ed25519 · office canary first</text><rect x="840" y="550" width="312" height="92" rx="12" fill="#1c2129" stroke="#3d444d" stroke-width="1.2"/><rect x="840" y="562" width="4" height="68" rx="2" fill="#9198a1"/><text x="860" y="584" font-size="16" font-weight="650" fill="#e6edf3" text-anchor="start">Support files · backups</text><text x="860" y="612" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">backups sealed to the owner's key</text><path d="M770 196 H834" fill="none" stroke="#f0a742" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-amber)"/><text x="804" y="188" font-size="12.5" font-weight="400" fill="#f