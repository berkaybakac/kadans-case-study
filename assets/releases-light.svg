<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><title>How a release reaches the stores, and what happens when it fails</title><defs><marker id="h-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#818b98"/></marker><marker id="h-server" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker><marker id="h-pi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a21caf"/></marker><marker id="h-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker></defs><rect width="1200" height="420" rx="16" fill="#ffffff" stroke="#d1d9e0"/><text x="40" y="54" font-size="26" font-weight="700" fill="#1f2328" text-anchor="start">Safe releases</text><text x="40" y="82" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">Customer servers update themselves overnight and report the outcome.</text><path d="M820 50 H854" fill="none" stroke="#4f46e5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="864" y="55" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">release and server</text><path d="M1001.8 50 H1035.8" fill="none" stroke="#a21caf" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="1045.8" y="55" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">branch players</text><rect x="40" y="112" width="204" height="122" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/><rect x="40" y="124" width="4" height="98" rx="2" fill="#4f46e5"/><circle cx="72" cy="141" r="13" fill="#4f46e5"/><text x="72" y="146" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="94" y="146" font-size="16" font-weight="650" fill="#1f2328" text-anchor="start">Windows checks</text><text x="60" y="174" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">clean runners: fresh,</text><text x="60" y="194" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">customer upgrade paths,</text><text x="60" y="214" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">rolled-back updates</text><path d="M249 173 H267" fill="none" stroke="#818b98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="274" y="112" width="204" height="122" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/><rect x="274" y="124" width="4" height="98" rx="2" fill="#4f46e5"/><circle cx="306" cy="141" r="13" fill="#4f46e5"/><text x="306" y="146" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="328" y="146" font-size="16" font-weight="650" fill="#1f2328" text-anchor="start">Sign</text><text x="294" y="174" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">Ed25519 key that</text><text x="294" y="194" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">never leaves the</text><text x="294" y="214" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">owner's machine</text><path d="M483 173 H501" fill="none" stroke="#818b98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="508" y="112" width="204" height="122" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/><rect x="508" y="124" width="4" height="98" rx="2" fill="#4f46e5"/><circle cx="540" cy="141" r="13" fill="#4f46e5"/><text x="540" y="146" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="562" y="146" font-size="16" font-weight="650" fill="#1f2328" text-anchor="start">Office canary</text><text x="528" y="174" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">installs it first and</text><text x="528" y="194" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">reports the outcome</text><text x="528" y="214" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">to the fleet hub</text><path d="M717 173 H735" fill="none" stroke="#818b98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="742" y="112" width="204" height="122" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/><rect x="742" y="124" width="4" height="98" rx="2" fill="#4f46e5"/><circle cx="774" cy="141" r="13" fill="#4f46e5"/><text x="774" y="146" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="796" y="146" font-size="16" font-weight="650" fill="#1f2328" text-anchor="start">Customers, at night</text><text x="762" y="174" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">each customer server,</text><text x="762" y="194" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">03:15, by default only</text><text x="762" y="214" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">what the canary installed</text><path d="M951 173 H969" fill="none" stroke="#818b98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#h-arrow)"/><rect x="976" y="112" width="204" height="122" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/><rect x="976" y="124" width="4" height="98" rx="2" fill="#a21caf"/><circle cx="1008" cy="141" r="13" fill="#a21caf"/><text x="1008" y="146" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="1030" y="146" font-size="16" font-weight="650" fill="#1f2328" text-anchor="start">Players follow</text><text x="996" y="174" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">each Pi updates from</text><text x="996" y="194" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">its own server, only</text><text x="996" y="214" font-size="14" font-weight="400" fill="#59636e" text-anchor="start">if its code changed</text><text x="40" y="300" font-size="16" font-weight="650" fill="#c2410c" text-anchor="start">If it fails</text><text x="40" y="324" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">each stage has</text><text x="40" y="344" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">its own recovery</text><path d="M610.0 240 V276" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#h-red)"/><rect x="508" y="282" width="204" height="76" rx="10" fill="#fdefe8" stroke="#fdefe8" stroke-width="1.2"/><text x="524" y="312" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start">customers keep the</text><text x="524" y="333" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start">release they run</text><path d="M844.0 240 V276" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#h-red)"/><rect x="742" y="282" width="204" height="76" rx="10" fill="#fdefe8" stroke="#fdefe8" stroke-width="1.2"/><text x="758" y="312" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start">a failed changeover</text><text x="758" y="333" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start">restores and reports</text><path d="M1078.0 240 V276" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#h-red)"/><rect x="976" y="282" width="204" height="76" rx="10" fill="#fdefe8" stroke="#fdefe8" stroke-width="1.2"/><text x="992" y="312" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start">no healthy player in 90 s:</text><text x="992" y="333" font-size="13.5" font-weight="400" fill="#1f2328" text-anchor="start">switch back to the old one</text></svg>
